services:
  stream-vault:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stream-vault
    restart: unless-stopped
    init: true # Reap zombie processes and handle POSIX signals correctly
    pids_limit: 100 # Hard limit on total processes: prevents fork thrashing and host PID table exhaustion
    ports:
      - "8090:8090"
    environment:
      - NODE_ENV=production
      - PORT=8090
      - HOST=0.0.0.0
      - CACHE_DIR=/app/.cache
      - DATA_DIR=/app/data
      - FFMPEG_MAX_CONCURRENCY=1
      - FFMPEG_TIMEOUT_MS=15000
      - LOG_LEVEL=info
    volumes:
      # Mount your host media collection read-only (:ro)
      - ./media:/media:ro
      - /:/hostfs:ro
      # Persistent cache for video frame thumbnails and extracted subtitles
      - ./.cache:/app/.cache
      # Persistent storage for folder metadata, libraries, and user databases
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          # 512MB accommodates Node baseline (~75MB) + 1 single-thread FFmpeg child worker (~150-200MB)
          memory: 512M
          pids: 100
        reservations:
          memory: 128M
